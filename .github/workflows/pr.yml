name: log trigger event

on:
  pull_request: # zizmor: ignore[dangerous-triggers] See #11332.
    types:
      - synchronize

permissions: {}

jobs:
  log-trigger-event:
    name: log trigger event
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: log trigger event
        #  EVENT: "${{ github.event }}"
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/collaborators/$SENDER/permission" --jq .permission | grep -q -e admin -e write; then
            echo "Synchronized by maintainer"
          else
            echo "Synchronized by untrusted user"
          fi
            
